<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1030" role="img" aria-labelledby="title desc">
  <title id="title">一个方法一个服务的幼稚拆分（手机布局）</title>
  <desc id="desc">上方是一个完整服务，下方是机械拆出的八个服务和八个数据库。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 10 5 0 10Z" fill="#425b66"/></marker>
    <style>
      text{font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif";fill:#263b44}.title{font-size:25px;font-weight:800}.label{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.muted{fill:#60737c}.danger{fill:#bd454d}.safe{fill:#357a64}.mono{font-family:SFMono-Regular,Consolas,monospace;font-size:16px}.line{stroke:#425b66;stroke-width:2.5;fill:none}.dash{stroke-dasharray:7 7}
    </style>

  </defs>
  <rect x="1" y="1" width="388" height="1028" rx="20" fill="#f7fafb" stroke="#dce6ea"/>

  <text x="195" y="43" text-anchor="middle" class="label">一个完整业务能力</text>
  <rect x="30" y="64" width="330" height="260" rx="16" fill="#fff" stroke="#405963" stroke-width="3"/>
  <rect x="30" y="64" width="330" height="54" rx="16" fill="#dcecf3"/>
  <text x="195" y="99" text-anchor="middle" class="label">待办项服务 · 8 个操作</text>
  <text x="55" y="154" class="small">＋ 添加</text><text x="205" y="154" class="small">＋ 更新</text><text x="55" y="197" class="small">＋ 归档</text><text x="205" y="197" class="small">＋ 设优先级</text><text x="55" y="240" class="small">＋ 列出</text><text x="205" y="240" class="small">＋ 搜索</text><text x="55" y="283" class="small">＋ 查看</text><text x="205" y="283" class="small">＋ 分配迭代</text>
  <text x="62" y="370" class="small danger">机械拆分</text>
  <polygon points="184,340 206,340 206,365 224,365 195,394 166,365 184,365" fill="#f5ae55"/>
  <text x="195" y="430" text-anchor="middle" class="label">8 个服务 · 8 份数据</text>
