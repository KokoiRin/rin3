<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 590" role="img" aria-labelledby="title desc">
  <title id="title">限界上下文的三种有效拆分</title>
  <desc id="desc">只要不让潜在客户的两个冲突模型落入同一边界，其他子域可以按团队和生命周期需要形成不同分组。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 10 5 0 10Z" fill="#425b66"/></marker>
    <style>
      text{font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif";fill:#263b44}.title{font-size:25px;font-weight:800}.label{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.muted{fill:#60737c}.danger{fill:#bd454d}.safe{fill:#357a64}.mono{font-family:SFMono-Regular,Consolas,monospace;font-size:16px}.line{stroke:#425b66;stroke-width:2.5;fill:none}.dash{stroke-dasharray:7 7}
    </style>

  </defs>
  <rect x="1" y="1" width="758" height="588" rx="20" fill="#f7fafb" stroke="#dce6ea"/>

  <text x="380" y="40" text-anchor="middle" class="label">边界保护模型一致性，但不规定唯一的组织方式</text>
  <text x="28" y="106" class="small" font-weight="800" fill="#2f7189">方案 1</text><rect x="124" y="70" width="306" height="134" rx="20" fill="#dcecf3" stroke="#607a86" stroke-width="2"/><text x="140" y="100" class="body" font-weight="800">营销</text><text x="140" y="129" class="small muted"><tspan x="140">客服台 · 电话 · 合同</tspan><tspan x="140" dy="23">活动管理 · 优化 · 身份访问</tspan></text><rect x="138" y="166" width="160" height="26" rx="13" fill="#fdebec"/><text x="148" y="184" class="small danger" font-weight="800">潜在客户模型 A</text><rect x="442" y="70" width="306" height="134" rx="20" fill="#dcecf3" stroke="#607a86" stroke-width="2"/><text x="458" y="100" class="body" font-weight="800">销售</text><text x="458" y="129" class="small muted"><tspan x="458">CRM · 计费 · 创意目录</tspan><tspan x="458" dy="23">优化 · 佣金 · 身份访问</tspan></text><rect x="456" y="166" width="160" height="26" rx="13" fill="#fdebec"/><text x="466" y="184" class="small danger" font-weight="800">潜在客户模型 B</text><text x="28" y="278" class="small" font-weight="800" fill="#2f7189">方案 2</text><rect x="124" y="242" width="202" height="134" rx="20" fill="#dcecf3" stroke="#607a86" stroke-width="2"/><text x="140" y="272" class="body" font-weight="800">营销</text><text x="140" y="301" class="small muted"><tspan x="140">创意目录 · 活动管理 · 优化</tspan><tspan x="140" dy="23"></tspan></text><rect x="138" y="338" width="160" height="26" rx="13" fill="#fdebec"/><text x="148" y="356" class="small danger" font-weight="800">模型 A</text><rect x="338" y="242" width="202" height="134" rx="20" fill="#dcecf3" stroke="#607a86" stroke-width="2"/><text x="354" y="272" class="body" font-weight="800">支撑</text><text x="354" y="301" class="small muted"><tspan x="354">客服台 · 电话 · 合同</tspan><tspan x="354" dy="23">计费 · 身份访问</tspan></text><rect x="552" y="242" width="202" height="134" rx="20" fill="#dcecf3" stroke="#607a86" stroke-width="2"/><text x="568" y="272" class="body" font-weight="800">销售</text><text x="568" y="301" class="small muted"><tspan x="568">CRM · 佣金 · 优化</tspan><tspan x="568" dy="23"></tspan></text><rect x="566" y="338" width="160" height="26" rx="13" fill="#fdebec"/><text x="576" y="356" class="small danger" font-weight="800">模型 B</text><text x="28" y="450" class="small" font-weight="800" fill="#2f7189">方案 3</text><rect x="124" y="414" width="306" height="134" rx="20" fill="#dcecf3" stroke="#607a86" stroke-width="2"/><text x="140" y="444" class="body" font-weight="800">营销</text><text x="140" y="473" class="small muted"><tspan x="140">创意目录 · 计费 · 合同</tspan><tspan x="140" dy="23">活动管理 · 优化 · 身份访问</tspan></text><rect x="138" y="510" width="160" height="26" rx="13" fill="#fdebec"/><text x="148" y="528" class="small danger" font-weight="800">模型 A</text><rect x="442" y="414" width="306" height="134" rx="20" fill="#dcecf3" stroke="#607a86" stroke-width="2"/><text x="458" y="444" class="body" font-weight="800">销售</text><text x="458" y="473" class="small muted"><tspan x="458">CRM · 电话 · 客服台</tspan><tspan x="458" dy="23">佣金 · 身份访问</tspan></text><rect x="456" y="510" width="160" height="26" rx="13" fill="#fdebec"/><text x="466" y="528" class="small danger" font-weight="800">模型 B</text>
  <text x="380" y="578" text-anchor="middle" class="small muted">三种方案都把模型 A 与模型 B 分开，因此都有效</text>
</svg>