ted">+ Execute</text><ellipse cx="515" cy="288" rx="24" ry="8" fill="#2f7fa4"/><path d="M491 288v25c0 5 11 8 24 8s24-3 24-8V288" fill="#2f7fa4"/><text x="515" y="310" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">DB</text><rect x="556" y="258" width="164" height="70" rx="11" fill="#dcecf3" stroke="#405963" stroke-width="2"/><text x="570" y="286" class="small" font-weight="800">搜索服务</text><text x="570" y="311" class="small muted">+ Execute</text><ellipse cx="693" cy="288" rx="24" ry="8" fill="#2f7fa4"/><path d="M669 288v25c0 5 11 8 24 8s24-3 24-8V288" fill="#2f7fa4"/><text x="693" y="310" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">DB</text><rect x="378" y="346" width="164" height="70" rx="11" fill="#dcecf3" stroke="#405963" stroke-width="2"/><text x="392" y="374" class="small" font-weight="800">查看服务</text><text x="392" y="399" class="small muted">+ Execute</text><ellipse cx="515" cy="376" rx="24" ry="8" fill="#2f7fa4"/><path d="M491 376v25c0 5 11 8 24 8s24-3 24-8V376" fill="#2f7fa4"/><text x="515" y="398" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">DB</text><rect x="556" y="346" width="164" height="70" rx="11" fill="#dcecf3" stroke="#405963" stroke-width="2"/><text x="570" y="374" class="small" font-weight="800">分配迭代服务</text><text x="570" y="399" class="small muted">+ Execute</text><ellipse cx="693" cy="376" rx="24" ry="8" fill="#2f7fa4"/><path d="M669 376v25c0 5 11 8 24 8s24-3 24-8V376" fill="#2f7fa4"/><text x="693" y="398" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">DB</text>
