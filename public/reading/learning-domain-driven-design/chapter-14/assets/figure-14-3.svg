<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">一个方法一个服务的幼稚拆分</title>
  <desc id="desc">原本一个拥有八个业务操作的待办项服务，被机械地拆成八个各自拥有数据库的细粒度服务。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 10 5 0 10Z" fill="#425b66"/></marker>
    <style>
      text{font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif";fill:#263b44}.title{font-size:25px;font-weight:800}.label{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.muted{fill:#60737c}.danger{fill:#bd454d}.safe{fill:#357a64}.mono{font-family:SFMono-Regular,Consolas,monospace;font-size:16px}.line{stroke:#425b66;stroke-width:2.5;fill:none}.dash{stroke-dasharray:7 7}
    </style>

  </defs>
  <rect x="1" y="1" width="758" height="498" rx="20" fill="#f7fafb" stroke="#dce6ea"/>

  <text x="175" y="52" text-anchor="middle" class="label">一个完整业务能力</text>
  <rect x="50" y="76" width="250" height="330" rx="16" fill="#fff" stroke="#405963" stroke-width="3"/>
  <rect x="50" y="76" width="250" height="58" rx="16" fill="#dcecf3"/>
  <text x="175" y="113" text-anchor="middle" class="title">待办项服务</text>
  <text x="78" y="169" dy="0" class="body">＋ 添加待办项</text><text x="78" y="169" dy="29" class="body">＋ 更新待办项</text><text x="78" y="169" dy="58" class="body">＋ 归档待办项</text><text x="78" y="169" dy="87" class="body">＋ 设优先级</text><text x="78" y="169" dy="116" class="body">＋ 列出待办项</text><text x="78" y="169" dy="145" class="body">＋ 搜索待办项</text><text x="78" y="169" dy="174" class="body">＋ 查看待办项</text><text x="78" y="169" dy="203" class="body">＋ 分配迭代待办项</text>
  <text x="339" y="190" text-anchor="middle" font-size="14" class="danger"><tspan x="339">机械套用</tspan><tspan x="339" dy="18">一方法一服务</tspan></text>
