<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1100" viewBox="0 0 680 1100" role="img" aria-labelledby="title desc">
  <title id="title">两个服务通过各自的公共接口通信</title>
  <desc id="desc">手机纵向布局。服务一和服务二的内部实现彼此隔离，同步请求响应与异步事件都必须经过双方的公共接口。</desc>
  <rect x="8" y="8" width="664" height="1084" rx="30" fill="#f7fafb" stroke="#dce6ea" stroke-width="3"/>

  <rect x="74" y="42" width="532" height="250" rx="20" fill="#dcecf3" stroke="#334b56" stroke-width="5"/>
  <rect x="74" y="216" width="532" height="76" fill="#f5ae55" stroke="#334b56" stroke-width="5"/>
  <text x="340" y="126" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="40" font-weight="700" fill="#20343d">服务 1</text>
  <text x="340" y="170" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="24" fill="#58707a">内部实现</text>
  <text x="340" y="264" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#263740">公共接口</text>

  <rect x="92" y="342" width="232" height="270" rx="30" fill="#fff" stroke="#b7c8cf" stroke-width="3"/>
  <text x="208" y="386" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#38545f">同步请求 / 响应</text>
  <line x1="208" y1="428" x2="208" y2="563" stroke="#2f7189" stroke-width="7"/>
  <polygon points="208,412 193,437 223,437" fill="#2f7189"/>
  <polygon points="208,579 193,554 223,554" fill="#2f7189"/>

  <rect x="356" y="342" width="232" height="270" rx="30" fill="#fff8ee" stroke="#e4c08e" stroke-width="3"/>
  <text x="472" y="386" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#7a5528">异步事件 / 消息</text>
  <line x1="472" y1="428" x2="472" y2="563" stroke="#e89d43" stroke-width="7" stroke-dasharray="14 11"/>
  <polygon points="472,412 457,437 487,437" fill="#e89d43"/>
  <polygon points="472,579 457,554 487,554" fill="#e89d43"/>
  <rect x="452" y="478" width="40" height="30" rx="4" fill="#fff8ee" stroke="#c77c25" stroke-width="4"/>
  <polyline points="455,482 472,496 489,482" fill="none" stroke="#c77c25" stroke-width="4"/>

  <rect x="74" y="650" width="532" height="86" rx="43" fill="#eaf3ef"/>
  <circle cx="112" cy="693" r="11" fill="#4f9278"/>
  <text x="350" y="684" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#315f4e">所有进入或离开服务的数据</text>
  <text x="350" y="716" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="24" font-weight="700" fill="#315f4e">都经过公共接口</text>

  <rect x="74" y="774" width="532" height="250" rx="20" fill="#dcecf3" stroke="#334b56" stroke-width="5"/>
  <rect x="74" y="774" width="532" height="76" fill="#f5ae55" stroke="#334b56" stroke-width="5"/>
  <text x="340" y="822" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="28" font-weight="700" fill="#263740">公共接口</text>
  <text x="340" y="926" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="40" font-weight="700" fill="#20343d">服务 2</text>
  <text x="340" y="970" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="24" fill="#58707a">内部实现</text>
</svg>
