<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 680" role="img" aria-labelledby="title desc">
  <title id="title">通过开放主机服务和发布语言集成（手机布局）</title>
  <desc id="desc">两个下游从下方向上调用开放主机服务；开放主机服务位于上游边界内，并把内部模型翻译成发布语言。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 10 5 0 10Z" fill="#425b66"/></marker>
    <style>
      text{font-family="Noto Sans SC, PingFang SC, Microsoft YaHei, sans-serif";fill:#263b44}.title{font-size:25px;font-weight:800}.label{font-size:21px;font-weight:700}.body{font-size:18px}.small{font-size:16px}.muted{fill:#60737c}.danger{fill:#bd454d}.safe{fill:#357a64}.mono{font-family:SFMono-Regular,Consolas,monospace;font-size:16px}.line{stroke:#425b66;stroke-width:2.5;fill:none}.dash{stroke-dasharray:7 7}
    </style>

  </defs>
  <rect x="1" y="1" width="388" height="678" rx="20" fill="#f7fafb" stroke="#dce6ea"/>

  <text x="195" y="41" text-anchor="middle" class="label"><tspan x="195">生产方负责翻译</tspan><tspan x="195" dy="28">下游只依赖发布语言</tspan></text>
  <rect x="28" y="92" width="334" height="278" rx="24" fill="#dcecf3" stroke="#405963" stroke-width="3"/>
  <text x="48" y="125" class="small muted">上游限界上下文</text>
  <rect x="56" y="150" width="278" height="86" rx="14" fill="#fff" stroke="#6b838e" stroke-width="2"/><text x="195" y="184" text-anchor="middle" class="body" font-weight="800">内部领域模型</text><text x="195" y="211" text-anchor="middle" class="small muted">复杂 · 可独立演进</text>
  <path d="M195 236V258" class="line" marker-end="url(#arrow)"/>
  <rect x="73" y="270" width="244" height="78" rx="16" fill="#f5ae55" stroke="#405963" stroke-width="2"/><text x="195" y="302" text-anchor="middle" class="body" font-weight="800">开放主机服务</text><text x="195" y="329" text-anchor="middle" class="small">输出发布语言</text>
  <rect x="20" y="458" width="170" height="112" rx="18" fill="#fff" stroke="#405963" stroke-width="2"/><text x="105" y="496" text-anchor="middle" class="body" font-weight="800"><tspan x="105">下游限界</tspan><tspan x="105" dy="25">上下文 A</tspan></text><text x="105" y="550" text-anchor="middle" font-size="14" class="muted">依赖发布语言</text>
  <rect x="200" y="458" width="170" height="112" rx="18" fill="#fff" stroke="#405963" stroke-width="2"/><text x="285" y="496" text-anchor="middle" class="body" font-weight="800"><tspan x="285">下游限界</tspan><tspan x="285" dy="25">上下文 B</tspan></text><text x="285" y="550" text-anchor="middle" font-size="14" class="muted">不感知内部模型</text>
  <path d="M105 458C105 413 150 397 162 348" class="line" marker-end="url(#arrow)"/>
  <path d="M285 458C285 413 240 397 228 348" class="line" marker-end="url(#arrow)"/>
  <text x="195" y="421" text-anchor="middle" font-size="14" class="muted">调用</text>
  <rect x="28" y="606" width="334" height="44" rx="22" fill="#eaf3ef"/><text x="195" y="635" text-anchor="middle" class="small safe">复杂度由上游封装</text>
</svg>