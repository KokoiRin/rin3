<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">两个服务通过各自的公共接口通信</title>
  <desc id="desc">服务一和服务二的内部实现彼此隔离。同步请求响应与异步事件都必须经过双方朝向外部的公共接口。</desc>
  <rect x="8" y="8" width="1184" height="484" rx="28" fill="#f7fafb" stroke="#dce6ea" stroke-width="2"/>
  <rect x="54" y="82" width="336" height="286" rx="18" fill="#dcecf3" stroke="#334b56" stroke-width="4"/>
  <rect x="302" y="82" width="88" height="286" fill="#f5ae55" stroke="#334b56" stroke-width="4"/>
  <line x1="302" y1="84" x2="302" y2="366" stroke="#334b56" stroke-width="3"/>
  <text x="178" y="198" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="34" font-weight="700" fill="#20343d">服务 1</text>
  <text x="178" y="239" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="18" fill="#58707a">内部实现</text>
  <text x="346" y="214" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#263740">公共</text>
  <text x="346" y="241" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#263740">接口</text>
  <rect x="810" y="82" width="336" height="286" rx="18" fill="#dcecf3" stroke="#334b56" stroke-width="4"/>
  <rect x="810" y="82" width="88" height="286" fill="#f5ae55" stroke="#334b56" stroke-width="4"/>
  <line x1="898" y1="84" x2="898" y2="366" stroke="#334b56" stroke-width="3"/>
  <text x="1022" y="198" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="34" font-weight="700" fill="#20343d">服务 2</text>
  <text x="1022" y="239" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="18" fill="#58707a">内部实现</text>
  <text x="854" y="214" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#263740">公共</text>
  <text x="854" y="241" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="19" font-weight="700" fill="#263740">接口</text>
  <rect x="430" y="112" width="340" height="92" rx="46" fill="#fff" stroke="#b7c8cf" stroke-width="2"/>
  <text x="600" y="143" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#38545f">同步请求 / 响应</text>
  <line x1="469" y1="171" x2="731" y2="171" stroke="#2f7189" stroke-width="5"/>
  <polygon points="458,171 476,160 476,182" fill="#2f7189"/>
  <polygon points="742,171 724,160 724,182" fill="#2f7189"/>
  <rect x="430" y="230" width="340" height="92" rx="46" fill="#fff8ee" stroke="#e4c08e" stroke-width="2"/>
  <text x="600" y="261" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="18" font-weight="700" fill="#7a5528">异步事件 / 消息</text>
  <line x1="469" y1="289" x2="731" y2="289" stroke="#e89d43" stroke-width="5" stroke-dasharray="12 9"/>
  <polygon points="458,289 476,278 476,300" fill="#e89d43"/>
  <polygon points="742,289 724,278 724,300" fill="#e89d43"/>
  <rect x="584" y="276" width="32" height="24" rx="3" fill="#fff8ee" stroke="#c77c25" stroke-width="3"/>
  <polyline points="586,279 600,290 614,279" fill="none" stroke="#c77c25" stroke-width="3"/>
  <rect x="244" y="405" width="712" height="52" rx="26" fill="#eaf3ef"/>
  <circle cx="278" cy="431" r="9" fill="#4f9278"/>
  <text x="600" y="438" text-anchor="middle" font-family="Noto Sans SC, PingFang SC, sans-serif" font-size="20" font-weight="700" fill="#315f4e">所有进入或离开服务的数据，都经过公共接口</text>
</svg>
