<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{CHAPTER_NUMBER}}｜{{CHAPTER_TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <style>
    :root {
      --paper: #fffefa;
      --canvas: #ecebe7;
      --ink: #26343b;
      --muted: #65757d;
      --accent: #39728d;
      --accent-soft: #e7f1f5;
      --line: #d9e2e6;
      --figure-bg: #f8fafb;
      --shadow: 0 18px 48px rgba(40, 50, 56, .10);
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--canvas);
    }

    body {
      margin: 0;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 17px;
      line-height: 1.78;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    .site-nav {
      display: flex;
      width: min(1160px, calc(100% - 32px));
      margin: 24px auto -16px;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }

    .site-nav a {
      color: var(--muted);
      text-decoration: none;
    }

    .reader {
      width: min(1160px, calc(100% - 32px));
      margin: 40px auto 72px;
      padding: 52px 360px 64px 64px;
      background: var(--paper);
      border: 1px solid rgba(57, 79, 90, .08);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .chapter-kicker,
    .note-kind {
      display: inline-flex;
      padding: 3px 12px;
      border-radius: 999px;
      color: var(--accent);
      background: var(--accent-soft);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .04em;
    }

    h1 {
      margin: 14px 0 4px;
      font-size: clamp(34px, 6vw, 46px);
      line-height: 1.18;
      letter-spacing: -.035em;
    }

    h2 {
      margin: 2.25em 0 .55em;
      font-size: 27px;
      line-height: 1.28;
      letter-spacing: -.02em;
    }

    h3 {
      margin: 1.7em 0 .4em;
      font-size: 20px;
      line-height: 1.35;
    }

    p {
      margin: .72em 0;
      text-align: justify;
      text-justify: inter-ideograph;
    }

    .lead {
      font-size: 18px;
      line-height: 1.72;
      color: #35464e;
    }

    .title-rule {
      width: 52px;
      height: 3px;
      margin: 18px 0 28px;
      border-radius: 99px;
      background: var(--accent);
    }

    .chapter-nav {
      display: flex;
      margin: 30px 0 38px;
      padding: 0;
      flex-wrap: wrap;
      gap: 8px;
      list-style: none;
    }

    .chapter-nav a {
      display: block;
      padding: 5px 11px;
      color: var(--muted);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 13px;
      line-height: 1.4;
      text-decoration: none;
    }

    .margin-note {
      position: relative;
      float: right;
      clear: right;
      width: 286px;
      margin: .15em -330px 20px 32px;
      padding: 14px 15px 15px;
      color: #52646c;
      border: 1px solid #d9e4e8;
      border-radius: 13px;
      background: #f8fbfc;
      box-shadow: 0 7px 18px rgba(51, 71, 81, .06);
      font-size: 14px;
      line-height: 1.62;
    }

    .margin-note::before {
      position: absolute;
      top: 22px;
      left: -25px;
      width: 18px;
      height: 1px;
      background: #aac3ce;
      content: "";
    }

    .margin-note h4 {
      margin: 8px 0 6px;
      color: var(--ink);
      font-size: 16px;
      line-height: 1.35;
    }

    .margin-note p {
      margin: .4em 0 0;
      text-align: left;
    }

    figure {
      margin: 1.35em 0 1.7em;
      break-inside: avoid;
    }

    .figure-frame {
      padding: 18px 18px 14px;
      overflow-x: auto;
      border: 1px solid #e1e8eb;
      border-radius: 14px;
      background: var(--figure-bg);
    }

    figcaption {
      margin-top: 9px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .figure-number {
      margin-right: .55em;
      color: var(--accent);
      font-weight: 800;
    }

    blockquote {
      margin: 1.25em 0;
      padding: 2px 0 2px 20px;
      color: #53646d;
      border-left: 3px solid #9bc2d2;
      font-size: 18px;
    }

    code {
      padding: .12em .35em;
      border-radius: 5px;
      background: #edf2f4;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: .88em;
    }

    @media (max-width: 1040px) {
      .reader {
        width: min(820px, calc(100% - 32px));
        padding: 52px 64px 64px;
      }

      .margin-note {
        float: none;
        width: auto;
        margin: 1em 0 1.25em;
      }

      .margin-note::before { display: none; }
    }

    @media (max-width: 680px) {
      body { font-size: 16px; }

      .reader {
        width: 100%;
        margin: 0;
        padding: 32px 22px 48px;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .figure-frame {
        margin-right: -6px;
        margin-left: -6px;
        padding: 12px 10px;
      }
    }

    @page {
      size: 177.8mm 233.3mm;
      margin: 13mm 15mm 14mm;
    }

    @media print {
      html, body { background: #fff; }
      body { font-size: 10.6pt; line-height: 1.62; }
      .site-nav, .chapter-nav { display: none; }

      .reader {
        width: auto;
        margin: 0;
        padding: 0;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .margin-note {
        float: none;
        width: auto;
        margin: 8pt 0 10pt;
        box-shadow: none;
        break-inside: avoid;
      }

      .margin-note::before { display: none; }
    }
  </style>
</head>
<body>
  <nav class="site-nav" aria-label="站点导航">
    <a href="{{BOOK_RECORD_HREF}}">← 返回整本书学习记录</a>
    <a href="{{SITE_HOME_HREF}}">RIN III</a>
  </nav>

  <main class="reader">
    <header>
      <span class="chapter-kicker">{{CHAPTER_NUMBER}}</span>
      <h1>{{CHAPTER_TITLE}}</h1>
      <div class="title-rule"></div>
      <p class="lead">{{LEAD}}</p>

      <nav aria-label="本章导航">
        <ul class="chapter-nav">
          <li><a href="#section-1">{{SECTION_1_TITLE}}</a></li>
          <li><a href="#section-2">{{SECTION_2_TITLE}}</a></li>
        </ul>
      </nav>
    </header>

    <section id="section-1">
      <h2>{{SECTION_1_TITLE}}</h2>
      <aside class="margin-note">
        <span class="note-kind">回到主线</span>
        <h4>{{NOTE_TITLE}}</h4>
        <p>{{NOTE_BODY}}</p>
      </aside>
      <p>{{TRANSLATED_PARAGRAPH}}</p>
    </section>

    <section id="section-2">
      <h2>{{SECTION_2_TITLE}}</h2>
      <p>{{TRANSLATED_PARAGRAPH}}</p>

      <figure>
        <div class="figure-frame">
          {{FIGURE_OR_DIAGRAM}}
        </div>
        <figcaption><span class="figure-number">{{FIGURE_NUMBER}}</span>{{FIGURE_CAPTION}}</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
